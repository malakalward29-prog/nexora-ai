<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Nexora AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#070711;color:#fff;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:1000;background:rgba(7,7,17,.88);backdrop-filter:blur(15px);border-bottom:1px solid #202033}
.navbar{max-width:1200px;margin:auto;padding:18px 25px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:900}
.logo span{color:#a78bfa}
.btn{border:0;cursor:pointer;border-radius:12px;padding:11px 18px;color:#fff;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:#151522;border:1px solid #303044}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#c026d3)}
.dashboard-container{max-width:1200px;margin:auto;padding:40px 25px}
.welcome-card{background:linear-gradient(135deg,#131022,#10101b);border:1px solid #3c236e;border-radius:22px;padding:30px;margin-bottom:30px}
.welcome-card h1{font-size:28px;margin-bottom:8px}
.welcome-card p{color:#858596;font-size:15px}
.grid-section{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.card{background:#10101b;border:1px solid #242438;border-radius:22px;padding:25px}
.card h2{font-size:20px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
@media(max-width:900px){.grid-section{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <div class="navbar">
    <a href="index.html" class="logo">Nexora <span>AI</span></a>
    <div>
      <button class="btn btn-dark" onclick="location.href='index.html'">Home</button>
      <button class="btn btn-purple" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="dashboard-container">
  <div class="welcome-card">
    <h1 id="welcomeTitle">Welcome back! 👋</h1>
    <p>Manage your saved favorite AI tools, active subscriptions, and account settings.</p>
  </div>

  <div class="grid-section">
    <!-- قسم المفضلة -->
    <div class="card">
      <h2>⭐ Saved Bookmarks</h2>
      <div id="bookmarksContainer">
        <p style="color:#858596; text-align:center; padding:20px;">Loading bookmarks...</p>
      </div>
    </div>

    <!-- قسم تفاصيل الحساب أو الاشتراكات -->
    <div class="card">
      <h2>🚀 Subscription Plan</h2>
      <p style="color:#a78bfa; font-weight:bold; font-size:18px; margin-bottom:15px;">Free Tier</p>
      <p style="color:#858596; font-size:14px; line-height:1.6; margin-bottom:20px;">You are currently on the free plan. Upgrade to Pro to unlock advanced AI features and personalized workflows.</p>
      <button class="btn btn-purple" style="width:100%;" onclick="location.href='index.html#pricing'">Upgrade Now</button>
    </div>
  </div>
</div>

<script>
const API_BASE = window.location.origin + '/api';
let authToken = localStorage.getItem('nexora_token');
let currentUser = null;

async function initDashboard() {
  if (!authToken) {
    location.href = 'index.html';
    return;
  }

  try {
    const res = await fetch(API_BASE + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    const data = await res.json();
    if (data && data.success && data.data) {
      currentUser = data.data;
      const userName = currentUser.profile && currentUser.profile.full_name ? currentUser.profile.full_name : currentUser.email;
      document.getElementById('welcomeTitle').textContent = `Welcome back, ${userName}! 👋`;
    }
  } catch (e) {
    console.error(e);
  }

  loadBookmarks();
}

async function loadBookmarks() {
  const container = document.getElementById('bookmarksContainer');
  try {
    const res = await fetch(API_BASE + '/user/bookmarks', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    const data = await res.json();
    if (data && data.success && data.data && data.data.length > 0) {
      container.innerHTML = data.data.map(b => `
        <div style="background:#151522; border:1px solid #2f2f45; border-radius:15px; padding:15px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h4 style="color:#fff; margin-bottom:4px; font-size:16px;">${b.name}</h4>
            <span style="color:#a78bfa; font-size:12px;">${b.category}</span>
          </div>
          <a href="${b.url}" target="_blank" class="btn btn-purple" style="padding:8px 14px; font-size:13px;">Use Tool →</a>
        </div>
      `).join('');
    } else {
      container.innerHTML = '<p style="color:#858596; text-align:center; padding:20px;">No saved bookmarks yet.</p>';
    }
  } catch (err) {
    container.innerHTML = '<p style="color:#f87171; text-align:center; padding:20px;">Failed to load bookmarks.</p>';
  }
}

function logout() {
  localStorage.removeItem('nexora_token');
  location.href = 'index.html';
}

window.onload = initDashboard;
</script>

</body>
</html>
