<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard - Nexora AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#070711;color:#fff;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit}
nav{background:rgba(7,7,17,.88);backdrop-filter:blur(15px);border-bottom:1px solid #202033;padding:18px 25px}
.navbar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:24px;font-weight:900}
.logo span{color:#a78bfa}
.dashboard-container{max-width:1200px;margin:40px auto;padding:0 25px;display:grid;grid-template-columns:280px 1fr;gap:30px}
.sidebar{background:#10101b;border:1px solid #242438;border-radius:20px;padding:25px;height:fit-content}
.sidebar-menu{list-style:none;margin-top:20px}
.sidebar-menu li{padding:12px 15px;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.2s;color:#9999aa}
.sidebar-menu li:hover,.sidebar-menu li.active{background:#7c3aed;color:#fff}
.main-content{display:flex;flex-direction:column;gap:30px}
.card{background:#10101b;border:1px solid #242438;border-radius:20px;padding:30px}
.card h2{font-size:22px;margin-bottom:15px}
.badge-status{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:bold}
.status-free{background:#2a2a3d;color:#a4a4b5}
.status-pro{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:15px}
.form-group{margin-bottom:15px}
.form-group label{display:block;color:#858596;font-size:13px;margin-bottom:6px}
.form-group input{width:100%;padding:12px;border-radius:10px;background:#080811;border:1px solid #29293d;color:#fff;outline:none}
.btn{border:0;cursor:pointer;border-radius:10px;padding:10px 20px;color:#fff;font-weight:bold;background:#7c3aed}
.btn:hover{background:#8b5cf6}
.favorites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;margin-top:15px}
.fav-item{background:#181329;border:1px solid #322554;border-radius:14px;padding:15px;display:flex;justify-content:space-between;align-items:center}
@media(max-width:768px){.dashboard-container{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
<div class="navbar">
<a href="index.html" class="logo">Nexora <span>AI</span></a>
<button class="btn" style="background:#151522;border:1px solid #303044;" onclick="logout()">Logout</button>
</div>
</nav>

<div class="dashboard-container">
<aside class="sidebar">
<h3>Welcome Back</h3>
<p id="userEmailDisplay" style="color:#858596;font-size:13px;margin-top:5px;word-break:break-all;"></p>
<ul class="sidebar-menu">
<li class="active" onclick="switchTab('overview')">Overview</li>
<li onclick="switchTab('profile')">Profile Settings</li>
<li onclick="switchTab('favorites')">Saved Favorites</li>
</ul>
</aside>

<main class="main-content">
<div id="tab-overview" class="card">
<h2>Subscription Status</h2>
<p style="color:#858596;margin-bottom:15px">Your current plan details and billing status.</p>
<div style="display:flex;align-items:center;gap:15px">
<span id="statusBadge" class="badge-status status-free">Free Plan</span>
<button class="btn" onclick="location.href='index.html#pricing'">Upgrade to Pro 🚀</button>
</div>
</div>

<div id="tab-profile" class="card" style="display:none;">
<h2>Profile Settings</h2>
<p style="color:#858596;margin-bottom:20px">Update your personal account details.</p>
<div class="profile-grid">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="profileName" placeholder="Enter your name">
</div>
<div class="form-group">
<label>Email Address</label>
<input type="email" id="profileEmail" disabled>
</div>
</div>
<button class="btn" onclick="saveProfile()">Save Changes</button>
</div>

<div id="tab-favorites" class="card" style="display:none;">
<h2>Saved Favorites</h2>
<p style="color:#858596;margin-bottom:15px">AI tools you have saved for quick access.</p>
<div id="favoritesList" class="favorites-grid">
<p style="color:#77778a">Loading favorites...</p>
</div>
</div>
</main>
</div>

<script>
const API_BASE = window.location.origin + '/api';
let authToken = localStorage.getItem('nexora_token');
let currentUser = null;

if (!authToken) {
  window.location.href = 'index.html';
}

async function fetchUserData() {
  try {
    const res = await fetch(API_BASE + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    const data = await res.json();
    if (data && data.success) {
      currentUser = data.data;
      document.getElementById('userEmailDisplay').textContent = currentUser.email;
      document.getElementById('profileEmail').value = currentUser.email;
      if (currentUser.profile && currentUser.profile.full_name) {
        document.getElementById('profileName').value = currentUser.profile.full_name;
      }
      if (currentUser.subscription && currentUser.subscription.status === 'pro') {
        const badge = document.getElementById('statusBadge');
        badge.textContent = 'Pro Plan Active';
        badge.className = 'badge-status status-pro';
      }
      fetchUserFavorites();
    } else {
      logout();
    }
  } catch (err) {
    console.error(err);
  }
}

async function fetchUserFavorites() {
  try {
    const res = await fetch(API_BASE + '/user/bookmarks', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    const data = await res.json();
    const container = document.getElementById('favoritesList');
    if (data && data.success && data.data && data.data.length > 0) {
      container.innerHTML = data.data.map(tool => `
        <div class="fav-item">
          <div>
            <strong>${tool.name}</strong>
            <span style="display:block;font-size:11px;color:#a78bfa;margin-top:4px">${tool.category}</span>
          </div>
          <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="window.open('${tool.url}', '_blank')">Open</button>
        </div>
      `).join('');
    } else {
      container.innerHTML = '<p style="color:#77778a">No favorite tools saved yet.</p>';
    }
  } catch (err) {
    console.error(err);
  }
}

function switchTab(tabName) {
  document.querySelectorAll('.sidebar-menu li').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  
  document.getElementById('tab-overview').style.display = 'none';
  document.getElementById('tab-profile').style.display = 'none';
  document.getElementById('tab-favorites').style.display = 'none';
  
  document.getElementById('tab-' + tabName).style.display = 'block';
}

async function saveProfile() {
  const fullName = document.getElementById('profileName').value;
  try {
    const res = await fetch(API_BASE + '/user/profile', {
      method: 'PUT',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken 
      },
      body: JSON.stringify({ fullName })
    });
    const data = await res.json();
    if (data && data.success) {
      alert('Profile updated successfully!');
    } else {
      alert('Failed to update profile.');
    }
  } catch (err) {
    alert('Connection error.');
  }
}

function logout() {
  localStorage.removeItem('nexora_token');
  window.location.href = 'index.html';
}

fetchUserData();
</script>
</body>
</html>
