<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora AI - Admin Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#070711;color:#fff;min-height:100vh;display:flex}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit}

/* الشريط الجانبي */
aside{width:260px;background:#0d0d18;border-right:1px solid #202033;padding:25px;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-size:24px;font-weight:900;margin-bottom:40px}
.logo span{color:#a78bfa}
.menu{display:flex;flex-direction:column;gap:10px}
.menu-item{padding:12px 16px;border-radius:12px;color:#858596;cursor:pointer;font-weight:bold;transition:.2s}
.menu-item:hover,.menu-item.active{background:#7c3aed;color:#fff}

/* المحتوى الرئيسي */
main{flex:1;padding:40px;overflow-y:auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.header h1{font-size:28px;font-weight:900}
.btn{border:0;cursor:pointer;border-radius:12px;padding:10px 18px;color:#fff;font-weight:bold;transition:.2s}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#c026d3)}
.btn-purple:hover{opacity:.9}
.btn-danger{background:#ef4444}
.btn-danger:hover{opacity:.9}

/* البطاقات والإحصائيات */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:35px}
.stat-card{background:#10101b;border:1px solid #242438;border-radius:20px;padding:25px}
.stat-card h3{color:#858596;font-size:14px;margin-bottom:10px}
.stat-card .number{font-size:32px;font-weight:900}

/* الجداول */
.card{background:#10101b;border:1px solid #242438;border-radius:20px;padding:25px;margin-bottom:25px}
.card h2{font-size:20px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th{color:#858596;padding:12px 15px;border-bottom:1px solid #202033}
td{padding:15px;border-bottom:1px solid #1a1a2b;color:#ddd}

/* النماذج (Forms) */
.form-group{margin-bottom:15px}
.form-group label{display:block;color:#858596;font-size:13px;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;border-radius:12px;background:#080811;border:1px solid #29293d;color:#fff;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:#8b5cf6}

@media(max-width:900px){body{flex-direction:column}aside{width:100%}}
</style>
</head>
<body>

<!-- الشريط الجانبي للإدارة -->
<aside>
  <div>
    <div class="logo">Nexora <span>Admin</span></div>
    <div class="menu">
      <div class="menu-item active" onclick="switchTab('tools', this)">🛠️ Manage Tools</div>
      <div class="menu-item" onclick="switchTab('reviews', this)">💬 Moderate Reviews</div>
      <div class="menu-item" onclick="switchTab('stats', this)">📊 Statistics</div>
    </div>
  </div>
  <div>
    <button class="btn btn-danger" style="width:100%" onclick="location.href='index.html'">← Back to Site</button>
  </div>
</aside>

<!-- لوحة التحكم الرئيسية -->
<main>
  <div class="header">
    <h1 id="pageTitle">Manage AI Tools</h1>
    <button class="btn btn-purple" onclick="openAddToolModal()">+ Add New Tool</button>
  </div>

  <!-- قسم إحصائيات سريعة -->
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Tools</h3>
      <div class="number" id="totalToolsCount">8</div>
    </div>
    <div class="stat-card">
      <h3>Total Reviews</h3>
      <div class="number" id="totalReviewsCount">14</div>
    </div>
    <div class="stat-card">
      <h3>Active Users</h3>
      <div class="number" id="totalUsersCount">32</div>
    </div>
  </div>

  <!-- جدول إدارة الأدوات -->
  <div class="card" id="toolsSection">
    <h2>Platform AI Tools</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Tool Name</th>
            <th>Category</th>
            <th>URL</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminToolsTable">
          <!-- سيتم تعبئتها ديناميكياً -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- قسم إدارة ومراجعة التعليقات (مخفي افتراضياً) -->
  <div class="card" id="reviewsSection" style="display:none;">
    <h2>User Reviews & Moderation</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Tool</th>
            <th>User</th>
            <th>Rating</th>
            <th>Comment</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminReviewsTable">
          <!-- سيتم تعبئتها ديناميكياً -->
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal إضافة أداة جديدة -->
<div id="addToolModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center; padding:20px;">
  <div style="background:#11111d; border:1px solid #303044; border-radius:20px; padding:30px; width:100%; max-width:500px;">
    <h2 style="margin-bottom:20px; font-size:20px;">Add New AI Tool</h2>
    <div class="form-group">
      <label>Tool Name</label>
      <input type="text" id="newToolName" placeholder="e.g. Perplexity AI">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="newToolCategory">
        <option value="Writing & Productivity">Writing & Productivity</option>
        <option value="Design">Design</option>
        <option value="Images">Images</option>
        <option value="Audio">Audio</option>
        <option value="Video">Video</option>
        <option value="Programming">Programming</option>
        <option value="Documents">Documents</option>
        <option value="Business">Business</option>
      </select>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="newToolDesc" rows="3" placeholder="Brief description of the tool..."></textarea>
    </div>
    <div class="form-group">
      <label>Website URL</label>
      <input type="text" id="newToolUrl" placeholder="https://...">
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-purple" style="flex:1" onclick="saveNewTool()">Save Tool</button>
      <button class="btn" style="background:#222; flex:1" onclick="closeAddToolModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
let adminTools = JSON.parse(localStorage.getItem('admin_tools') || JSON.stringify([
  { name: 'ChatGPT', category: 'Writing & Productivity', url: 'https://chatgpt.com', desc: 'AI assistant for writing, research...' },
  { name: 'Canva AI', category: 'Design', url: 'https://www.canva.com', desc: 'Create presentations and designs...' },
  { name: 'Midjourney', category: 'Images', url: 'https://www.midjourney.com', desc: 'Generate creative AI images...' },
  { name: 'Claude AI', category: 'Documents', url: 'https://claude.ai', desc: 'Analyze long PDF documents...' }
]));

let adminReviews = JSON.parse(localStorage.getItem('admin_reviews') || JSON.stringify([
  { id: 1, tool: 'ChatGPT', user: 'Ahmed', rating: 5, comment: 'أفضل أداة استخدمتها في حياتي!' },
  { id: 2, tool: 'Midjourney', user: 'Sara', rating: 4, comment: 'النتائج مذهلة جداً ولكن تحتاج اشتراك.' }
]));

function renderTools() {
  const tbody = document.getElementById('adminToolsTable');
  tbody.innerHTML = adminTools.map((t, index) => `
    <tr>
      <td style="font-weight:bold;">${t.name}</td>
      <td><span style="background:#191526; color:#b9a2ff; padding:4px 10px; border-radius:8px; font-size:12px;">${t.category}</span></td>
      <td style="color:#858596; max-width:200px; overflow:hidden; text-overflow:ellipsis;">${t.url}</td>
      <td>
        <button class="btn btn-danger" style="padding:6px 12px; font-size:12px;" onclick="deleteTool(${index})">Delete</button>
      </td>
    </tr>
  `).join('');
  document.getElementById('totalToolsCount').textContent = adminTools.length;
}

function renderReviews() {
  const tbody = document.getElementById('adminReviewsTable');
  tbody.innerHTML = adminReviews.map(r => `
    <tr>
      <td style="font-weight:bold;">${r.tool}</td>
      <td>${r.user}</td>
      <td style="color:#f59e0b;">${'⭐'.repeat(r.rating)}</td>
      <td style="color:#aaa;">${r.comment}</td>
      <td>
        <button class="btn btn-danger" style="padding:6px 12px; font-size:12px;" onclick="deleteReview(${r.id})">Delete</button>
      </td>
    </tr>
  `).join('');
  document.getElementById('totalReviewsCount').textContent = adminReviews.length;
}

function switchTab(tab, el) {
  document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');

  if (tab === 'tools') {
    document.getElementById('toolsSection').style.display = 'block';
    document.getElementById('reviewsSection').style.display = 'none';
    document.getElementById('pageTitle').textContent = 'Manage AI Tools';
  } else if (tab === 'reviews') {
    document.getElementById('toolsSection').style.display = 'none';
    document.getElementById('reviewsSection').style.display = 'block';
    document.getElementById('pageTitle').textContent = 'Moderate Reviews';
    renderReviews();
  } else {
    alert('إحصائيات المنصة تعمل بكفاءة عالية حالياً.');
  }
}

function openAddToolModal() {
  document.getElementById('addToolModal').style.display = 'flex';
}

function closeAddToolModal() {
  document.getElementById('addToolModal').style.display = 'none';
}

function saveNewTool() {
  const name = document.getElementById('newToolName').value.trim();
  const category = document.getElementById('newToolCategory').value;
  const desc = document.getElementById('newToolDesc').value.trim();
  const url = document.getElementById('newToolUrl').value.trim();

  if (!name || !url) {
    alert('الرجاء إدخال اسم الأداة ورابط الموقع على الأقل.');
    return;
  }

  adminTools.push({ name, category, desc, url });
  localStorage.setItem('admin_tools', JSON.stringify(adminTools));
  renderTools();
  closeAddToolModal();
  
  document.getElementById('newToolName').value = '';
  document.getElementById('newToolDesc').value = '';
  document.getElementById('newToolUrl').value = '';
  alert('تمت إضافة الأداة بنجاح!');
}

function deleteTool(index) {
  if (confirm('هل أنت متأكد من حذف هذه الأداة؟')) {
    adminTools.splice(index, 1);
    localStorage.setItem('admin_tools', JSON.stringify(adminTools));
    renderTools();
  }
}

function deleteReview(id) {
  if (confirm('هل أنت متأكد من حذف هذا التعليق المسيء أو المخالف؟')) {
    adminReviews = adminReviews.filter(r => r.id !== id);
    localStorage.setItem('admin_reviews', JSON.stringify(adminReviews));
    renderReviews();
  }
}

renderTools();
</script>
</body>
</html>
