<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">لوميرا - منتجات العناية الطبيعية</title>
    <style>
        :root {
            --primary-color: #6a4c93;
            --secondary-color: #f4f1de;
            --text-color: #333;
            --bg-color: #fdfcf7;
            --white: #ffffff;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            margin: 0 15px;
            font-size: 1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-btn {
            background-color: var(--white);
            color: var(--primary-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .lang-btn:hover {
            background-color: var(--secondary-color);
        }

        /* تنسيق قائمة المستخدم (لوحة التحكم) */
        .user-menu-container {
            position: relative;
            display: inline-block;
        }

        .user-name-btn {
            background: none;
            border: none;
            color: var(--white);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            /* يتغير موضع القائمة حسب اتجاه الصفحة */
            [dir="rtl"] & { right: 0; }
            [dir="ltr"] & { left: 0; }
            background-color: var(--white);
            color: var(--text-color);
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            border-radius: 8px;
            z-index: 1000;
            overflow: hidden;
            margin-top: 10px;
        }

        .dropdown-content a {
            color: var(--text-color);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            margin: 0;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .dropdown-content a:hover {
            background-color: var(--secondary-color);
            color: var(--primary-color);
        }

        .show {
            display: block;
        }

        main {
            padding: 3rem 2rem;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 1rem auto;
        }

        .cta-btn {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 2rem;
        }

        .cta-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" data-i18n="logo_text">لوميرا</div>
        
        <nav>
            <a href="#" data-i18n="nav_home">الرئيسية</a>
            <a href="#" data-i18n="nav_products">منتجاتنا</a>
            <a href="#" data-i18n="nav_about">من نحن</a>
        </nav>

        <div class="header-actions">
            <!-- زر تبديل اللغة -->
            <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">EN</button>

            <!-- قائمة لوحة التحكم الخاصة بالمستخدم -->
            <div class="user-menu-container">
                <button class="user-name-btn" onclick="toggleUserMenu()">
                    <span data-i18n="user_greeting">حنين ماهر</span> ▼
                </button>
                <div id="userDropdown" class="dropdown-content">
                    <a href="#" data-i18n="menu_favorites">المفضلة</a>
                    <a href="#" data-i18n="menu_comments">التعليقات</a>
                    <a href="#" data-i18n="menu_account">إدارة الحساب</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <h1 data-i18n="main_heading">تجربة العناية الطبيعية الفاخرة</h1>
        <p data-i18n="main_paragraph">اكتشفي تشكيلة زبدة الجسم المصنوعة من أجود المكونات الطبيعية مثل زبدة الشيا، الكاكاو، زيوت الجوجوبا، اللوز، وفيتامين إي لتمنح بشرتكِ نعومة وترطيباً يدوم طويلاً.</p>
        <button class="cta-btn" data-i18n="cta_button">تسوقي المنتجات الآن</button>
    </main>

    <script>
        // قاموس النصوص شاملة لوحة التحكم والترجمة
        const translations = {
            ar: {
                page_title: "لوميرا - منتجات العناية الطبيعية",
                logo_text: "لوميرا",
                nav_home: "الرئيسية",
                nav_products: "منتجاتنا",
                nav_about: "من نحن",
                user_greeting: "حنين ماهر",
                menu_favorites: "❤️ المفضلة",
                menu_comments: "💬 التعليقات",
                menu_account: "⚙️ إدارة الحساب",
                main_heading: "تجربة العناية الطبيعية الفاخرة",
                main_paragraph: "اكتشفي تشكيلة زبدة الجسم المصنوعة من أجود المكونات الطبيعية مثل زبدة الشيا، الكاكاو، زيوت الجوجوبا، اللوز، وفيتامين إي لتمنح بشرتكِ نعومة وترطيباً يدوم طويلاً.",
                cta_button: "تسوقي المنتجات الآن",
                next_lang_btn: "EN"
            },
            en: {
                page_title: "Lumira - Natural Care Products",
                logo_text: "Lumira",
                nav_home: "Home",
                nav_products: "Products",
                nav_about: "About Us",
                user_greeting: "Hanin Maher",
                menu_favorites: "❤️ Favorites",
                menu_comments: "💬 Comments",
                menu_account: "⚙️ Account Settings",
                main_heading: "The Ultimate Natural Care Experience",
                main_paragraph: "Discover our handcrafted body butter collection made with the finest natural ingredients like shea butter, cocoa, jojoba, almond oil, and vitamin E to give your skin long-lasting softness and deep hydration.",
                cta_button: "Shop Products Now",
                next_lang_btn: "AR"
            }
        };

        // دالة إظهار وإخفاء القائمة المنسدلة عند الضغط على الاسم
        function toggleUserMenu() {
            document.getElementById("userDropdown").classList.toggle("show");
        }

        // إغلاق القائمة إذا ضغط المستخدم في أي مكان خارجها
        window.onclick = function(event) {
            if (!event.target.matches('.user-name-btn') && !event.target.matches('.user-name-btn *')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        // دالة تغيير اللغة
        function setLanguage(lang) {
            const htmlRoot = document.getElementById('htmlRoot');
            htmlRoot.setAttribute('lang', lang);
            htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            // تحديث كافة النصوص التي تحتوي على سمة data-i18n
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // تحديث نص زر التبديل نفسه
            const langBtn = document.getElementById('langToggleBtn');
            langBtn.textContent = translations[lang].next_lang_btn;

            // حفظ الاختيار في المتصفح
            localStorage.setItem('preferred_lang', lang);
        }

        // دالة تبديل اللغة عند الضغط على الزر
        function toggleLanguage() {
            const currentLang = localStorage.getItem('preferred_lang') || 'ar';
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            setLanguage(newLang);
        }

        // استرجاع اللغة المفضلة للمستخدم عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferred_lang') || 'ar';
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
